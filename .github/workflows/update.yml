name: Update DE/US subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DE/US subscriptions
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          git config user.name "v2ray-bot-de-us"
          git config user.email "bot@example.invalid"
          git add de.txt us.txt stats.json
          git diff --cached --quiet || git commit -m "Update DE/US subscriptions"
          git push

      # Telegram is optional: if the Secrets are not set, this step is
      # skipped and the workflow still succeeds (files are still committed).
      - name: Notify on Telegram (optional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 notify.py
